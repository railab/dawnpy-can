[build-system]
requires = ["setuptools >= 61.2"]
build-backend = "setuptools.build_meta"

[project]
name = "dawnpy-can"
version = "0.1.0"
description = "CAN transport package for Dawn built on top of dawnpy"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "dawnpy",
  "click>=8.1",
  "python-can>=4.0",
]

[project.urls]
Repository = "https://github.com/railab/dawnpy-can"
Documentation = "https://railab.github.io/dawn/tools/dawnpy-can.html"
"Dawn Project" = "https://github.com/railab/dawn"

[project.scripts]
dawnpy-can = "dawnpy_can.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dawnpy_can*"]

[tool.setuptools.package-data]
dawnpy_can = ["py.typed"]

[tool.black]
line-length = 79
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 79
